<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Bangladesh Rush</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    touch-action: none;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;

    display: flex;
    justify-content: space-between;

    color: white;
    font-size: 18px;
    font-weight: bold;

    z-index: 10;

    text-shadow: 0 2px 4px #000;
}

#city {
    position: fixed;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);

    color: white;
    font-size: 20px;
    font-weight: bold;

    z-index: 10;

    text-shadow: 0 2px 5px #000;
}

#startScreen,
#gameOver {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.75);

    color: white;

    z-index: 20;

    text-align: center;
}

#gameOver {
    display: none;
}

h1 {
    font-size: clamp(42px, 10vw, 80px);
    margin-bottom: 10px;
}

.subtitle {
    font-size: 18px;
    margin-bottom: 25px;
}

button {
    border: none;
    border-radius: 12px;

    padding: 14px 30px;

    font-size: 18px;
    font-weight: bold;

    background: #00c853;
    color: white;

    cursor: pointer;
}

button:active {
    transform: scale(.95);
}

#controls {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;

    display: flex;
    justify-content: center;
    gap: 15px;

    z-index: 15;
}

.control {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,.5);

    background: rgba(0,0,0,.45);

    color: white;

    font-size: 25px;

    display: flex;
    align-items: center;
    justify-content: center;
}

@media (min-width: 800px) {
    #controls {
        opacity: .25;
    }

    #controls:hover {
        opacity: 1;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div>🪙 <span id="coins">0</span></div>
    <div>📏 <span id="distance">0</span> m</div>
</div>

<div id="city">🏙️ DHAKA</div>

<div id="startScreen">

    <h1>🇧🇩 BD RUSH</h1>

    <div class="subtitle">
        Run. Escape. Reach Rajshahi.
    </div>

    <button onclick="startGame()">
        ▶ START
    </button>

    <p style="margin-top:20px;font-size:14px;">
        PC: ← → ↑ ↓ &nbsp; | &nbsp;
        Mobile: Swipe
    </p>

</div>

<div id="gameOver">

    <h1>💥 CAUGHT!</h1>

    <div class="subtitle">
        The police caught you!
    </div>

    <div style="margin-bottom:20px;">
        🪙 Coins: <span id="finalCoins">0</span>
        <br>
        📏 Distance: <span id="finalDistance">0</span> m
    </div>

    <button onclick="restartGame()">
        🔄 RUN AGAIN
    </button>

</div>

<div id="controls">

    <div class="control" id="leftBtn">←</div>
    <div class="control" id="jumpBtn">↑</div>
    <div class="control" id="slideBtn">↓</div>
    <div class="control" id="rightBtn">→</div>

</div>

<script>

/* =========================================================
   BD RUSH
   Simple 3D-style Endless Runner Prototype
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W;
let H;

function resize(){

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

window.addEventListener("resize", resize);

resize();


/* =========================
   GAME VARIABLES
   ========================= */

let running = false;

let playerLane = 1;

let targetLane = 1;

let playerY = 0;
let velocityY = 0;

let jumping = false;
let sliding = false;

let coins = 0;
let distance = 0;

let speed = 7;

let policeDistance = 1;

let obstacles = [];
let coinObjects = [];

let spawnTimer = 0;
let coinTimer = 0;

let lastTime = 0;


/* =========================
   CITIES
   ========================= */

const cities = [

    {
        name: "🏙️ DHAKA",
        distance: 0
    },

    {
        name: "🌆 GAZIPUR",
        distance: 250
    },

    {
        name: "🌾 TANGAIL",
        distance: 600
    },

    {
        name: "🌊 SIRAJGANJ",
        distance: 1000
    },

    {
        name: "🌳 NATORE",
        distance: 1450
    },

    {
        name: "🏁 RAJSHAHI",
        distance: 2000
    }

];


/* =========================
   START
   ========================= */

function startGame(){

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameOver").style.display = "none";

    resetGame();

    running = true;

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);

}


/* =========================
   RESET
   ========================= */

function resetGame(){

    playerLane = 1;
    targetLane = 1;

    playerY = 0;
    velocityY = 0;

    jumping = false;
    sliding = false;

    coins = 0;
    distance = 0;

    speed = 7;

    policeDistance = 1;

    obstacles = [];
    coinObjects = [];

    spawnTimer = 0;
    coinTimer = 0;

    updateHUD();

}


/* =========================
   RESTART
   ========================= */

function restartGame(){

    startGame();

}


/* =========================
   INPUT
   ========================= */

function moveLeft(){

    if(!running) return;

    targetLane--;

    if(targetLane < 0)
        targetLane = 0;

}


function moveRight(){

    if(!running) return;

    targetLane++;

    if(targetLane > 2)
        targetLane = 2;

}


function jump(){

    if(!running) return;

    if(!jumping){

        velocityY = 16;

        jumping = true;

    }

}


function slide(){

    if(!running) return;

    if(!jumping){

        sliding = true;

        setTimeout(() => {

            sliding = false;

        }, 600);

    }

}


/* =========================
   KEYBOARD
   ========================= */

document.addEventListener("keydown", e => {

    if(e.key === "ArrowLeft")
        moveLeft();

    if(e.key === "ArrowRight")
        moveRight();

    if(e.key === "ArrowUp")
        jump();

    if(e.key === "ArrowDown")
        slide();

});


/* =========================
   TOUCH BUTTONS
   ========================= */

document.getElementById("leftBtn")
.addEventListener("pointerdown", moveLeft);

document.getElementById("rightBtn")
.addEventListener("pointerdown", moveRight);

document.getElementById("jumpBtn")
.addEventListener("pointerdown", jump);

document.getElementById("slideBtn")
.addEventListener("pointerdown", slide);


/* =========================
   SWIPE CONTROLS
   ========================= */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", e => {

    const t = e.touches[0];

    touchStartX = t.clientX;
    touchStartY = t.clientY;

}, {passive:false});


canvas.addEventListener("touchend", e => {

    const t = e.changedTouches[0];

    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;

    const absX = Math.abs(dx);
    const absY = Math.abs(dy);

    if(Math.max(absX, absY) < 30)
        return;

    if(absX > absY){

        if(dx > 0)
            moveRight();
        else
            moveLeft();

    }else{

        if(dy < 0)
            jump();
        else
            slide();

    }

    e.preventDefault();

}, {passive:false});


/* =========================
   GAME LOOP
   ========================= */

function gameLoop(time){

    if(!running)
        return;

    const dt = Math.min((time - lastTime) / 16.67, 2);

    lastTime = time;

    update(dt);

    draw();

    requestAnimationFrame(gameLoop);

}


/* =========================
   UPDATE
   ========================= */

function update(dt){

    /* PLAYER LANE */

    playerLane +=
        (targetLane - playerLane) * 0.25 * dt;


    /* JUMP */

    if(jumping){

        playerY += velocityY * dt;

        velocityY -= 0.9 * dt;

        if(playerY <= 0){

            playerY = 0;

            velocityY = 0;

            jumping = false;

        }

    }


    /* SPEED */

    speed += 0.002 * dt;

    distance += speed * 0.12 * dt;


    /* OBSTACLES */

    spawnTimer -= dt;

    if(spawnTimer <= 0){

        spawnObstacle();

        spawnTimer =
            Math.max(35, 75 - speed * 3);

    }


    for(let i = obstacles.length - 1; i >= 0; i--){

        const o = obstacles[i];

        o.z -= speed * dt;

        if(o.z < -1.2){

            obstacles.splice(i,1);

            continue;

        }

        checkObstacleCollision(o);

    }


    /* COINS */

    coinTimer -= dt;

    if(coinTimer <= 0){

        spawnCoin();

        coinTimer = 20;

    }


    for(let i = coinObjects.length - 1; i >= 0; i--){

        const c = coinObjects[i];

        c.z -= speed * dt;

        if(c.z < -1.2){

            coinObjects.splice(i,1);

            continue;

        }

        checkCoinCollision(c);

    }


    /* POLICE */

    policeDistance += 0.002 * dt;

    policeDistance =
        Math.min(policeDistance, 1);


    /* COLLISION PENALTY */

    /* handled in collision */


    updateCity();

    updateHUD();

}


/* =========================
   OBSTACLE
   ========================= */

function spawnObstacle() {

    const lane = Math.floor(Math.random() * 3);

    const types = [
        "car",
        "bus",
        "truck",
        "train",
        "barrier"
    ];

    const type =
        types[Math.floor(Math.random() * types.length)];

    obstacles.push({
        lane: lane,
        z: 1.0,
        type: type
    });
}


/* =========================
   COIN
   ========================= */

function spawnCoin(){

    const lane =
        Math.floor(Math.random() * 3);

    coinObjects.push({

        lane: lane,

        z: 1.2

    });

}


/* =========================
   COLLISION
   ========================= */

function checkObstacleCollision(o){

    if(
        Math.abs(o.z) < 0.12 &&
        Math.abs(o.lane - playerLane) < 0.3
    ){

        if(jumping && playerY > 0.8)
            return;

        if(sliding && o.type === "barrier")
            return;

        /* Police gets closer */

        policeDistance -= 0.25;

        if(policeDistance <= 0){

            gameOver();

        }

        obstacles.splice(
            obstacles.indexOf(o),
            1
        );

    }

}


/* =========================
   COIN COLLISION
   ========================= */

function checkCoinCollision(c){

    if(
        Math.abs(c.z) < 0.12 &&
        Math.abs(c.lane - playerLane) < 0.3
    ){

        coins++;

        policeDistance =
            Math.min(
                1,
                policeDistance + 0.01
            );

        coinObjects.splice(
            coinObjects.indexOf(c),
            1
        );

    }

}


/* =========================
   CITY UPDATE
   ========================= */

function updateCity(){
    let current = cities[0];

    for(const city of cities){
        if(distance >= city.distance)
            current = city;
    }

    document.getElementById("city")
        .textContent = current.name;
}

function updateHUD(){
    document.getElementById("coins")
        .textContent = coins;

    document.getElementById("distance")
        .textContent = Math.floor(distance);
}


/* =========================
   GAME OVER
   ========================= */

function gameOver(){

    running = false;

    document.getElementById("finalCoins")
        .textContent = coins;

    document.getElementById("finalDistance")
        .textContent =
        Math.floor(distance);

    document.getElementById("gameOver")
        .style.display = "flex";

}


/* =========================================================
   DRAW
   ========================================================= */

function draw(){

    /* SKY */

    const sky =
        ctx.createLinearGradient(
            0,0,
            0,H
        );

    sky.addColorStop(
        0,
        "#65c9ff"
    );

    sky.addColorStop(
        1,
        "#dff6ff"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,0,
        W,H
    );


    /* SUN */

    ctx.fillStyle =
        "rgba(255,240,150,.9)";

    ctx.beginPath();

    ctx.arc(
        W * .82,
        H * .18,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* BACKGROUND */

    drawBackground();


    /* ROAD */

    drawRoad();


    /* COINS */

    for(const c of coinObjects){

        drawObject(
            c.lane,
            c.z,
            "coin"
        );

    }


    /* OBSTACLES */

    for(const o of obstacles){

        drawObject(
            o.lane,
            o.z,
            o.type
        );

    }


    /* POLICE */

    drawPolice();


    /* PLAYER */

    drawPlayer();

}


/* =========================
   BACKGROUND
   ========================= */

function drawBackground(){

    /* Green ground */

    ctx.fillStyle = "#4caf50";

    ctx.fillRect(
        0,
        H * .48,
        W,
        H * .52
    );


    /* Buildings */

    for(let i = 0; i < 9; i++){

        const x =
            i * W / 8 - 30;

        const height =
            50 + (i % 4) * 25;

        ctx.fillStyle =
            i % 2
            ? "#78909c"
            : "#607d8b";

        ctx.fillRect(
            x,
            H * .48 - height,
            65,
            height
        );

    }

}


/* =========================
   ROAD
   ========================= */

function drawRoad(){

    const horizon =
        H * .47;

    ctx.fillStyle = "#3c3c3c";

    ctx.beginPath();

    ctx.moveTo(
        W * .43,
        horizon
    );

    ctx.lineTo(
        W * .57,
        horizon
    );

    ctx.lineTo(
        W * .95,
        H
    );

    ctx.lineTo(
        W * .05,
        H
    );

    ctx.closePath();

    ctx.fill();


    /* Lane lines */

    ctx.strokeStyle =
        "#eeeeee";

    ctx.lineWidth = 4;

    const lines = [1/3, 2/3];

    for(const p of lines){

        ctx.beginPath();

        ctx.moveTo(
            W * (
                .43 +
                .14 * p
            ),
            horizon
        );

        ctx.lineTo(
            W * p,
            H
        );

        ctx.stroke();

    }

}


/* =========================
   OBJECT PROJECTION
   ========================= */

function project(lane,z){

    const horizon =
        H * .47;

    const depth =
        1 / z;

    const y =
        horizon +
        (H - horizon) *
        Math.min(
            1,
            depth * .16
        );

    const roadWidth =
        W * (
            .14 +
            Math.min(
                1,
                depth * .08
            )
        );

    const laneWidth =
        roadWidth / 3;

    const x =
        W / 2 +
        (lane - 1) *
        laneWidth;

    return {
        x,
        y,
        scale: Math.min(
            2.2,
            depth * .18
        )
    };

}


/* =========================
   DRAW OBJECT
   ========================= */

function drawObject(lane, z, type) {

    if (z <= 0.05) return;

    const p = project(lane, z);
    const s = p.scale;

    // 🚗 CAR
    if (type === "car") {

        ctx.fillStyle = "#e53935";

        ctx.fillRect(
            p.x - 25 * s,
            p.y - 55 * s,
            50 * s,
            55 * s
        );

        ctx.fillStyle = "#90caf9";

        ctx.fillRect(
            p.x - 17 * s,
            p.y - 45 * s,
            34 * s,
            18 * s
        );

        return;
    }


    // 🚌 BUS
    if (type === "bus") {

        ctx.fillStyle = "#1565c0";

        ctx.fillRect(
            p.x - 32 * s,
            p.y - 85 * s,
            64 * s,
            85 * s
        );

        ctx.fillStyle = "#b3e5fc";

        for (let i = 0; i < 3; i++) {

            ctx.fillRect(
                p.x - 24 * s + i * 17 * s,
                p.y - 70 * s,
                12 * s,
                18 * s
            );

        }

        return;
    }


    // 🚛 TRUCK
    if (type === "truck") {

        ctx.fillStyle = "#ff9800";

        ctx.fillRect(
            p.x - 35 * s,
            p.y - 70 * s,
            70 * s,
            70 * s
        );

        ctx.fillStyle = "#37474f";

        ctx.fillRect(
            p.x - 23 * s,
            p.y - 58 * s,
            46 * s,
            22 * s
        );

        return;
    }


    // 🚆 TRAIN
    if (type === "train") {

        ctx.fillStyle = "#455a64";

        ctx.fillRect(
            p.x - 45 * s,
            p.y - 105 * s,
            90 * s,
            105 * s
        );

        ctx.fillStyle = "#81d4fa";

        ctx.fillRect(
            p.x - 28 * s,
            p.y - 82 * s,
            20 * s,
            18 * s
        );

        ctx.fillRect(
            p.x + 8 * s,
            p.y - 82 * s,
            20 * s,
            18 * s
        );

        return;
    }


    // 🚧 BARRIER
    if (type === "barrier") {

        ctx.fillStyle = "#ff6d00";

        ctx.fillRect(
            p.x - 40 * s,
            p.y - 30 * s,
            80 * s,
            30 * s
        );

        ctx.fillStyle = "#ffffff";

        for (let i = 0; i < 3; i++) {

            ctx.fillRect(
                p.x - 30 * s + i * 25 * s,
                p.y - 23 * s,
                10 * s,
                18 * s
            );

        }

    }

}


/* =========================
   PLAYER
   ========================= */

function drawPlayer(){

    const laneX =
        W / 2 +
        (playerLane - 1) *
        (W * .12);

    const baseY =
        H * .84 -
        playerY * 20;

    ctx.save();

    /* shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        laneX,
        H * .88,
        25,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle =
        "#008f39";

    const bodyHeight =
        sliding ? 30 : 55;

    ctx.fillRect(
        laneX - 18,
        baseY - bodyHeight,
        36,
        bodyHeight
    );


    /* head */

    if(!sliding){

        ctx.fillStyle =
            "#d9a066";

        ctx.beginPath();

        ctx.arc(
            laneX,
            baseY - 75,
            18,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* cap */

        ctx.fillStyle =
            "#e63946";

        ctx.fillRect(
            laneX - 20,
            baseY - 94,
            40,
            9
        );

    }


    /* legs */

    ctx.strokeStyle =
        "#222";

    ctx.lineWidth = 9;

    if(!sliding){

        ctx.beginPath();

        ctx.moveTo(
            laneX - 8,
            baseY
        );

        ctx.lineTo(
            laneX - 17,
            baseY + 25
        );

        ctx.moveTo(
            laneX + 8,
            baseY
        );

        ctx.lineTo(
            laneX + 17,
            baseY + 25
        );

        ctx.stroke();

    }

    ctx.restore();

}


/* =========================
   POLICE
   ========================= */

function drawPolice(){

    const x =
        W / 2;

    const y =
        H * .93;

    const scale =
        .55 +
        (1 - policeDistance) * .45;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );

    /* body */

    ctx.fillStyle =
        "#263238";

    ctx.fillRect(
        -25,
        -70,
        50,
        65
    );


    /* head */

    ctx.fillStyle =
        "#d9a066";

    ctx.beginPath();

    ctx.arc(
        0,
        -90,
        20,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* police cap */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        -25,
        -112,
        50,
        10
    );


    /* badge */

    ctx.fillStyle =
        "#ffd700";

    ctx.beginPath();

    ctx.arc(
        0,
        -43,
        6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* arms */

    ctx.strokeStyle =
        "#263238";

    ctx.lineWidth = 12;

    ctx.beginPath();

    ctx.moveTo(
        -20,
        -60
    );

    ctx.lineTo(
        -40,
        -25
    );

    ctx.moveTo(
        20,
        -60
    );

    ctx.lineTo(
        40,
        -25
    );

    ctx.stroke();


    /* text */

    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 14px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "POLICE",
        0,
        -25
    );

    ctx.restore();

}


/* =========================
   PREVENT PAGE SCROLL
   ========================= */

document.addEventListener(
    "touchmove",
    e => e.preventDefault(),
    {passive:false}
);

</script>

</body>
</html>
