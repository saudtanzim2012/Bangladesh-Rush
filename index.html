<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Bangladesh Rush 🇧🇩</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;

    color:white;
    font-size:18px;
    font-weight:bold;

    z-index:10;

    text-shadow:0 2px 5px #000;
}

#city{
    position:fixed;

    top:55px;
    left:50%;

    transform:translateX(-50%);

    color:white;
    font-size:20px;
    font-weight:bold;

    z-index:10;

    text-shadow:0 2px 5px #000;
}

#startScreen,
#gameOver{

    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.75);

    color:white;

    z-index:20;

    text-align:center;
}

#gameOver{
    display:none;
}

h1{
    font-size:clamp(40px,10vw,80px);
    margin-bottom:10px;
}

button{

    border:none;

    border-radius:12px;

    padding:14px 30px;

    font-size:18px;
    font-weight:bold;

    background:#00c853;
    color:white;

    cursor:pointer;
}

#controls{

    position:fixed;

    bottom:25px;
    left:0;
    right:0;

    display:flex;
    justify-content:center;

    gap:15px;

    z-index:15;
}

.control{

    width:65px;
    height:65px;

    border-radius:50%;

    background:rgba(0,0,0,.45);

    border:2px solid rgba(255,255,255,.5);

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:25px;
}

</style>
</head>

<body>

<div id="game"></div>


<div id="hud">

    <div>
        🪙 <span id="coins">0</span>
    </div>

    <div>
        📏 <span id="distance">0</span> m
    </div>

</div>


<div id="city">
    🏙️ DHAKA
</div>


<div id="startScreen">

    <h1>🇧🇩</h1>

    <h1>BANGLADESH RUSH</h1>

    <p style="margin-bottom:25px;">
        Run. Escape. Reach Rajshahi.
    </p>

    <button onclick="startGame()">
        ▶ START
    </button>

    <p style="margin-top:20px;font-size:14px;">
        PC: ← → ↑ ↓
        <br>
        Mobile: Swipe
    </p>

</div>


<div id="gameOver">

    <h1>💥 CAUGHT!</h1>

    <p style="margin-bottom:20px;">
        The police caught you!
    </p>

    <p>
        🪙 Coins:
        <span id="finalCoins">0</span>
    </p>

    <p style="margin-bottom:20px;">
        📏 Distance:
        <span id="finalDistance">0</span> m
    </p>

    <button onclick="restartGame()">
        🔄 RUN AGAIN
    </button>

</div>


<div id="controls">

    <div class="control" id="leftBtn">
        ←
    </div>

    <div class="control" id="jumpBtn">
        ↑
    </div>

    <div class="control" id="slideBtn">
        ↓
    </div>

    <div class="control" id="rightBtn">
        →
    </div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =========================================================
   BANGLADESH RUSH
   3D PROTOTYPE
   ========================================================= */


/* =========================
   THREE.JS
========================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x78c8ff
    );


/* CAMERA */

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.1,
        500
    );

camera.position.set(
    0,
    4.5,
    8
);

camera.lookAt(
    0,
    1.5,
    -20
);


/* RENDERER */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================
   LIGHT
========================= */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        2
    );

scene.add(
    ambient
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

sun.position.set(
    5,
    10,
    5
);

scene.add(
    sun
);


/* =========================
   ROAD
========================= */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color:0x303030
    });

const road =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            12,
            500
        ),

        roadMaterial

    );

road.rotation.x =
    -Math.PI / 2;

road.position.z =
    -220;

scene.add(
    road
);


/* =========================
   GRASS
========================= */

const grassMaterial =
    new THREE.MeshStandardMaterial({
        color:0x3d8f42
    });


const grassLeft =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            30,
            500
        ),

        grassMaterial

    );

grassLeft.rotation.x =
    -Math.PI / 2;

grassLeft.position.set(
    -21,
    -0.02,
    -220
);

scene.add(
    grassLeft
);


const grassRight =
    grassLeft.clone();

grassRight.position.x =
    21;

scene.add(
    grassRight
);


/* =========================
   ROAD LINES
========================= */

const lineMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });


function createLaneLine(x){

    const line =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                0.08,
                500
            ),

            lineMaterial

        );

    line.rotation.x =
        -Math.PI / 2;

    line.position.set(
        x,
        0.02,
        -220
    );

    scene.add(
        line
    );

}


createLaneLine(-2);
createLaneLine(2);


/* =========================================================
   PLAYER
   ========================================================= */

const player =
    new THREE.Group();

scene.add(
    player
);

player.position.set(
    0,
    0,
    0
);


/* BODY */

const bodyMaterial =
    new THREE.MeshStandardMaterial({
        color:0x168a45,
        roughness:0.7
    });


const body =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            0.35,
            0.8,
            8,
            16
        ),

        bodyMaterial

    );

body.position.y =
    1.45;

player.add(
    body
);


/* HEAD */

const skinMaterial =
    new THREE.MeshStandardMaterial({
        color:0xc6865b,
        roughness:0.8
    });


const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.34,
            24,
            24
        ),

        skinMaterial

    );

head.position.y =
    2.35;

player.add(
    head
);


/* HAIR */

const hairMaterial =
    new THREE.MeshStandardMaterial({
        color:0x17120e
    });


const hair =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.35,
            24,
            16,
            0,
            Math.PI * 2,
            0,
            Math.PI / 2
        ),

        hairMaterial

    );

hair.position.y =
    2.43;

player.add(
    hair
);


/* LEFT ARM */

const armGeometry =
    new THREE.CapsuleGeometry(
        0.11,
        0.65,
        6,
        10
    );


const armMaterial =
    new THREE.MeshStandardMaterial({
        color:0x168a45
    });


const leftArm =
    new THREE.Mesh(
        armGeometry,
        armMaterial
    );

leftArm.position.set(
    -0.48,
    1.45,
    0
);

player.add(
    leftArm
);


/* RIGHT ARM */

const rightArm =
    leftArm.clone();

rightArm.position.x =
    0.48;

player.add(
    rightArm
);


/* LEGS */

const legMaterial =
    new THREE.MeshStandardMaterial({
        color:0x263238
    });


const legGeometry =
    new THREE.CapsuleGeometry(
        0.13,
        0.75,
        6,
        10
    );


const leftLeg =
    new THREE.Mesh(
        legGeometry,
        legMaterial
    );

leftLeg.position.set(
    -0.2,
    0.55,
    0
);

player.add(
    leftLeg
);


const rightLeg =
    leftLeg.clone();

rightLeg.position.x =
    0.2;

player.add(
    rightLeg
);


/* SHOES */

const shoeMaterial =
    new THREE.MeshStandardMaterial({
        color:0x111111
    });


const leftShoe =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            0.28,
            0.15,
            0.5
        ),

        shoeMaterial

    );

leftShoe.position.set(
    -0.2,
    0.08,
    -0.08
);

player.add(
    leftShoe
);


const rightShoe =
    leftShoe.clone();

rightShoe.position.x =
    0.2;

player.add(
    rightShoe
);


/* =========================================================
   POLICE
   ========================================================= */

const police =
    new THREE.Group();

scene.add(
    police
);

police.position.set(
    0,
    0,
    4
);


/* POLICE BODY */

const policeBody =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            0.35,
            0.8,
            8,
            16
        ),

        new THREE.MeshStandardMaterial({
            color:0x202c38
        })

    );

policeBody.position.y =
    1.45;

police.add(
    policeBody
);


/* POLICE HEAD */

const policeHead =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.34,
            24,
            24
        ),

        skinMaterial

    );

policeHead.position.y =
    2.35;

police.add(
    policeHead
);


/* POLICE CAP */

const policeCap =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            0.38,
            0.38,
            0.12,
            24
        ),

        new THREE.MeshStandardMaterial({
            color:0x111111
        })

    );

policeCap.position.y =
    2.68;

police.add(
    policeCap
);


/* =========================
   GAME VARIABLES
========================= */

let running = false;

let lane = 1;
let targetLane = 1;

const laneX = [
    -4,
    0,
    4
];

let velocityY = 0;
let jumping = false;

let distance = 0;
let coins = 0;

let speed = 0.22;

let animationTime = 0;


/* =========================
   START
========================= */

function startGame(){

    document
        .getElementById("startScreen")
        .style.display =
        "none";

    document
        .getElementById("gameOver")
        .style.display =
        "none";

    running = true;

    distance = 0;
    coins = 0;

    lane = 1;
    targetLane = 1;

    player.position.set(
        0,
        0,
        0
    );

    police.position.set(
        0,
        0,
        4
    );

    requestAnimationFrame(
        animate
    );

}


/* =========================
   RESTART
========================= */

function restartGame(){

    startGame();

}


/* =========================
   MOVEMENT
========================= */

function moveLeft(){

    if(!running)
        return;

    targetLane--;

    if(targetLane < 0)
        targetLane = 0;

}


function moveRight(){

    if(!running)
        return;

    targetLane++;

    if(targetLane > 2)
        targetLane = 2;

}


function jump(){

    if(!running)
        return;

    if(!jumping){

        velocityY = 0.28;

        jumping = true;

    }

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e => {

        if(e.key === "ArrowLeft")
            moveLeft();

        if(e.key === "ArrowRight")
            moveRight();

        if(e.key === "ArrowUp")
            jump();

    }
);


/* =========================
   MOBILE BUTTONS
========================= */

document
    .getElementById("leftBtn")
    .addEventListener(
        "pointerdown",
        moveLeft
    );


document
    .getElementById("rightBtn")
    .addEventListener(
        "pointerdown",
        moveRight
    );


document
    .getElementById("jumpBtn")
    .addEventListener(
        "pointerdown",
        jump
    );


/* =========================
   SWIPE
========================= */

let touchX = 0;
let touchY = 0;


renderer.domElement.addEventListener(
    "touchstart",
    e => {

        touchX =
            e.touches[0].clientX;

        touchY =
            e.touches[0].clientY;

    },
    {passive:true}
);


renderer.domElement.addEventListener(
    "touchend",
    e => {

        const dx =
            e.changedTouches[0].clientX
            - touchX;

        const dy =
            e.changedTouches[0].clientY
            - touchY;

        if(Math.abs(dx) >
           Math.abs(dy)){

            if(dx > 30)
                moveRight();

            else if(dx < -30)
                moveLeft();

        }
        else{

            if(dy < -30)
                jump();

        }

    },
    {passive:true}
);


/* =========================
   ANIMATION
========================= */

function animate(){

    if(!running)
        return;

    requestAnimationFrame(
        animate
    );


    /* LANE */

    const desiredX =
        laneX[targetLane];

    player.position.x +=
        (desiredX -
         player.position.x)
        * 0.12;


    /* JUMP */

    if(jumping){

        player.position.y +=
            velocityY;

        velocityY -=
            0.012;

        if(
            player.position.y <= 0
        ){

            player.position.y = 0;

            velocityY = 0;

            jumping = false;

        }

    }


    /* RUNNING ANIMATION */

    animationTime +=
        0.25;


    const swing =
        Math.sin(
            animationTime
        ) * 0.6;


    leftLeg.rotation.x =
        swing;

    rightLeg.rotation.x =
        -swing;

    leftArm.rotation.x =
        -swing;

    rightArm.rotation.x =
        swing;


    /* POLICE RUN */

    police.position.x +=
        (
            player.position.x -
            police.position.x
        ) * 0.08;


    police.position.z =
        4 +
        Math.sin(
            animationTime
        ) * 0.05;


    /* DISTANCE */

    distance +=
        speed;


    /* SPEED */

    speed +=
        0.00002;


    /* CAMERA */

    camera.position.x +=
        (
            player.position.x * 0.35 -
            camera.position.x
        ) * 0.08;


    camera.lookAt(
        player.position.x * 0.2,
        1.5,
        -20
    );


    /* HUD */

    document
        .getElementById("coins")
        .textContent =
        coins;


    document
        .getElementById("distance")
        .textContent =
        Math.floor(
            distance
        );


    /* CITY */

    updateCity();


    renderer.render(
        scene,
        camera
    );

}


/* =========================
   CITY
========================= */

const cities = [

    {
        name:"🏙️ DHAKA",
        distance:0
    },

    {
        name:"🌆 GAZIPUR",
        distance:250
    },

    {
        name:"🌾 TANGAIL",
        distance:600
    },

    {
        name:"🌊 SIRAJGANJ",
        distance:1000
    },

    {
        name:"🌳 NATORE",
        distance:1450
    },

    {
        name:"🏁 RAJSHAHI",
        distance:2000
    }

];


function updateCity(){

    let current =
        cities[0];

    for(
        const city of cities
    ){

        if(
            distance >=
            city.distance
        ){

            current =
                city;

        }

    }

    document
        .getElementById("city")
        .textContent =
        current.name;

}


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* INITIAL RENDER */

renderer.render(
    scene,
    camera
);

</script>

</body>
</html>
